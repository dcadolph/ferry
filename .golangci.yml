version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # The summary file path comes from the user on purpose.
        - G304
    lll:
      # Code stays within 100 columns. Function signatures may reach 120.
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: var-naming
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: receiver-naming
        - name: indent-error-flow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - lll

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dcadolph/ferry

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
